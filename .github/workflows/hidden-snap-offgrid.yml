name: hidden-snap-offgrid
on:
  push:
    paths:
      - 'scripts/shell-helper.ps1'
      - 'lib/safe-desktop.js'
      - 'lib/links.js'
      - 'tools/hidden-snap-offgrid-ci.*'
      - '.github/workflows/hidden-snap-offgrid.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Measure snap ON effect on one self-owned off-grid fixture
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/hidden-snap-offgrid-ci.ps1 2>&1 | Tee-Object -FilePath hidden-snap-offgrid-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-snap-offgrid-evidence
          path: |
            hidden-snap-offgrid-ci.json
            hidden-snap-offgrid-ci.log
