name: hidden-snap-refresh
on:
  push:
    paths:
      - 'tools/hidden-snap-refresh-*'
      - 'tools/view-refresh-injection-ci.cs'
      - '.github/workflows/hidden-snap-refresh.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [none, refresh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dense hidden snap OFF Refresh comparison
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/hidden-snap-refresh-ci.ps1 -Mode '${{ matrix.mode }}' 2>&1 | Tee-Object -FilePath hidden-snap-refresh-${{ matrix.mode }}-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve timings and safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-snap-refresh-${{ matrix.mode }}-evidence
          path: |
            hidden-snap-refresh-${{ matrix.mode }}-ci.json
            hidden-snap-refresh-${{ matrix.mode }}-ci.log
