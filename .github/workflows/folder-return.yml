name: folder-return
on:
  push:
  workflow_dispatch:
jobs:
  folder-return:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run selftest
      - name: Renderer stale reads and metadata CAS race regression
        run: node tools/renderer-board-race-selftest.js
      - name: Missing-material search and candidate token regressions
        run: |
          node tools/test-material-rescue.js
          node tools/test-material-rescue-controller.js
          node tools/folder-return-inspect-selftest.js
      - name: Native rename and forced-interruption recovery
        run: powershell -NoProfile -NonInteractive -File tools/folder-return-native-selftest.ps1
      - name: Real C to D and D to C moves are refused without copying
        run: powershell -NoProfile -NonInteractive -File tools/folder-return-cross-volume-ci.ps1
      - name: Persistent worker real rename and warm timing
        run: node tools/folder-return-worker-selftest.js
      - run: npm run build
      - name: Packaged Desktop drop redirects to normal folder without copy
        run: node tests/packaged-folder-return.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folder-return-evidence
          path: folder-return-evidence/
          if-no-files-found: ignore
