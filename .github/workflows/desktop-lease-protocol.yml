name: desktop-lease-protocol
on:
  push:
    paths:
      - 'tools/snap-lease-*'
      - 'tools/desktop-lease-protocol-*'
      - 'tools/desktop-legacy-*'
      - 'lib/desktop-legacy-*'
      - 'lib/desktop-lease-*'
      - 'scripts/snap-lease.ps1'
      - 'scripts/shell-helper.ps1'
      - 'lib/safe-desktop.js'
      - '.github/workflows/desktop-lease-protocol.yml'
  workflow_dispatch:
jobs:
  node-watchdog:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Independent global Desktop exclusion
        shell: pwsh
        run: node ./tools/desktop-lease-global-lock-selftest.js
      - name: Initialization failure does not leak watchdogs
        shell: pwsh
        run: node ./tools/desktop-lease-init-selftest.js
      - name: Legacy route reservation state machine
        shell: pwsh
        run: node ./tools/desktop-legacy-reservation-selftest.js
      - name: Canonical lease geometry pure checks
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/snap-lease-geometry-selftest.ps1
      - name: Read-only native Shell session identity verification
        shell: pwsh
        run: powershell -NoProfile -File ./tools/lease-session-read-selftest.ps1
      - name: Truthful attribute notification contract without Shell events
        shell: pwsh
        run: powershell -NoProfile -File ./tools/hidden-notify-stub-selftest.ps1
      - name: Canonical identity equality pure regression
        shell: pwsh
        run: powershell -NoProfile -File ./tools/icon-key-candidate-selftest.ps1
      - name: Batch attribute safety pure checks
        shell: pwsh
        run: powershell -NoProfile -File ./tools/lease-attribute-batch-selftest.ps1
      - name: Atomic journal replacement pure checks
        shell: pwsh
        run: powershell -NoProfile -File ./tools/snap-lease-json-selftest.ps1
      - name: Isolated commit permission and receipts, never production
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tools/desktop-lease-protocol-ci.ps1 2>&1 | Tee-Object -FilePath desktop-lease-protocol-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy owner death preserves global reservation (hosted only)
        shell: pwsh
        run: node ./tools/desktop-legacy-native-ci.js
      - name: Retain journal and fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lease-protocol-evidence
          path: |
            desktop-legacy-native-ci.json
            desktop-lease-protocol-ci.json
            desktop-lease-protocol-ci.log
            desktop-lease-protocol-journals/**
