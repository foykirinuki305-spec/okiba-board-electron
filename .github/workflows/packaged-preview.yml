name: packaged-preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/packaged-preview-*'
      - '.github/workflows/packaged-preview.yml'
jobs:
  native-packaged-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node tools/packaged-preview-selftest.js
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Real packaged native preview IPC (no settings setup)
        run: node tools/packaged-preview-ci.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-preview-evidence
          path: packaged-preview-evidence/
          if-no-files-found: error
