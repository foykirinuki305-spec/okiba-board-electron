name: packaged-preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/packaged-preview-*'
      - 'tools/packaged-mixed-preview-*'
      - 'main.js'
      - 'lib/desktop-*'
      - 'scripts/*lease*'
      - 'scripts/shell-helper.ps1'
      - '.github/workflows/packaged-preview.yml'
jobs:
  native-packaged-preview:
    strategy:
      fail-fast: false
      matrix:
        prefix: [packaged-preview, packaged-mixed-preview]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node tools/${{ matrix.prefix }}-selftest.js
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/${{ matrix.prefix }}-records-selftest.ps1
      - run: npx electron-builder --win --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Real packaged native preview IPC (no settings setup)
        run: node tools/${{ matrix.prefix }}-ci.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.prefix }}-evidence
          path: ${{ matrix.prefix }}-evidence/
          if-no-files-found: error
