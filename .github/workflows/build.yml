name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Headless self-test (pure fs logic)
        run: node tools/selftest.js

      # The bundled PowerShell scripts only ever run on end-user PCs
      # (tests stub them), so at least prove here that each script
      # parses and its embedded C# interop compiles.
      - name: PowerShell scripts parse + embedded C# compiles
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('scripts/resolve-drop.ps1', 'scripts/position-desktop-icons.ps1')) {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $f), [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count) {
              $errs | ForEach-Object { Write-Host "$f syntax error: $($_.Message)" }
              $failed = $true
            }
            $src = Get-Content -Raw $f
            if ($src -match "(?s)Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@") {
              try {
                Add-Type -TypeDefinition $Matches[1] -ErrorAction Stop
                Write-Host "$f : embedded C# compiles"
              } catch {
                Write-Host "$f : C# compile failed: $($_.Exception.Message)"
                $failed = $true
              }
            }
          }
          if ($failed) { throw 'PowerShell script check failed' }

      # Real-desktop integration test: position-desktop-icons.ps1
      # drives the runner's actual Explorer desktop listview (the
      # v1.3.0 LVITEM-offset bug passed every stubbed test and only
      # failed on a real PC). Fails the build when positioning does
      # not stick; the only tolerated outcome besides PASS is the
      # loud, documented no-desktop SKIP inside the test script.
      - name: Desktop icon positioning on the REAL Explorer desktop
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/desktop-position-test.ps1

      - name: GUI end-to-end test (Playwright Electron, real UI operations)
        run: node tests/gui.e2e.js
        env:
          OKIBA_SHOTS: ${{ github.workspace }}\screenshots

      - name: Build portable exe
        run: npx electron-builder --win portable

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'exe not found in dist' }
          Write-Host "EXE: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Launch smoke (in-app self-test mode)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          $env:OKIBA_SELFTEST = '1'
          $env:OKIBA_BASE = Join-Path $env:RUNNER_TEMP 'okiba-smoke-base'
          $env:OKIBA_OLD_BASE = Join-Path $env:RUNNER_TEMP 'okiba-smoke-old'
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait
          Write-Host "smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "launch smoke failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: OkibaBoard-exe
          path: dist/*.exe

      - name: Upload GUI screenshots (design check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

      - name: Upload desktop-position diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-position-diagnostics
          path: desktop-position-diagnostics.txt
          if-no-files-found: ignore
