name: rename-arrival-ab
on:
  push:
    paths:
      - 'tools/rename-arrival-*'
      - '.github/workflows/rename-arrival-ab.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [none, notify, delete-create]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Matched warm helper rename arrival benchmark
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/rename-arrival-ab-ci.ps1 -Mode '${{ matrix.mode }}' 2>&1 | Tee-Object -FilePath rename-arrival-${{ matrix.mode }}-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve timings and safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-arrival-${{ matrix.mode }}-evidence
          path: |
            rename-arrival-${{ matrix.mode }}-ci.json
            rename-arrival-${{ matrix.mode }}-ci.log
