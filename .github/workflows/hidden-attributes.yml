name: hidden-attributes
on:
  push:
    paths:
      - 'tools/hidden-attributes-*'
      - 'tools/hidden-attributes-injection-ci.cs'
      - '.github/workflows/hidden-attributes.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [none, attributes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dense hidden native unhide ATTRIBUTES comparison
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/hidden-attributes-ci.ps1 -Mode '${{ matrix.mode }}' 2>&1 | Tee-Object -FilePath hidden-attributes-${{ matrix.mode }}-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve timings and safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-attributes-${{ matrix.mode }}-evidence
          path: |
            hidden-attributes-${{ matrix.mode }}-ci.json
            hidden-attributes-${{ matrix.mode }}-ci.log
